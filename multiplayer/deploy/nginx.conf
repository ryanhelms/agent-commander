worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
stream {
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    upstream relay {
        zone relay 64k;
        least_conn;
        server edge-a:8443 resolve max_fails=1 fail_timeout=5s;
        server edge-b:8443 resolve max_fails=1 fail_timeout=5s;
    }
    server {
        listen 8443;
        proxy_pass relay;
        proxy_connect_timeout 1s;
        proxy_next_upstream_timeout 2s;
        proxy_timeout 120s;
    }
}
